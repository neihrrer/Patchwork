id: org.patchwork.Patchwork
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: patchwork

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: python3-Pillow
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-build-isolation --no-deps "Pillow>=10.0"

  - name: blueprint-compiler
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.gnome.org/jwestman/blueprint-compiler.git
        tag: v0.22.2

  - name: gmic
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DBUILD_LIB=OFF
      - -DBUILD_LIB_STATIC=ON
      - -DBUILD_CLI=ON
      - -DBUILD_MAN=OFF
      - -DBUILD_BASH_COMPLETION=OFF
      - -DENABLE_LTO=ON
    sources:
      - type: git
        url: https://github.com/GreycLab/gmic.git
        # Kept in step with the G'MIC Fedora ships (4.0.3): the community
        # filter snapshot in src/gmic/stdlib.py is pinned for this version.
        tag: v.4.0.3

  - name: patchwork
    buildsystem: meson
    sources:
      - type: dir
        path: ..
