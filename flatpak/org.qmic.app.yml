id: org.qmic.app
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
command: qmic

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: python3-Pillow
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-build-isolation --no-deps Pillow

  - name: blueprint-compiler
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.gnome.org/jwestman/blueprint-compiler.git
        tag: v0.12.0

  - name: gmic
    buildsystem: cmake
    builddir: true
    config-opts:
      - -DBUILD_LIBS=OFF
      - -DENABLE_FFMPEG=OFF
      - -DENABLE_GRAPHICS_MAGICK=OFF
      - -DENABLE_QT=OFF
    sources:
      - type: git
        url: https://github.com/GreycLab/gmic.git
        tag: v3.4.3

  - name: qmic
    buildsystem: meson
    sources:
      - type: dir
        path: ..
