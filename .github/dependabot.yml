version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # Both are minimum floors for compatibility with distro packages, not
      # pins: raising them to the newest release only narrows what runs
      # Patchwork. Security advisories still open PRs.
      - dependency-name: "PyGObject"
      - dependency-name: "Pillow"
