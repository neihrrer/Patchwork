name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          dnf install -y \
            python3-gobject \
            gtk4 \
            libadwaita \
            meson \
            blueprint-compiler \
            gmic \
            ImageMagick \
            python3-pillow \
            python3-pytest

      - name: Setup build
        run: meson setup build

      - name: Build
        run: meson compile -C build

      - name: Lint
        run: python3 -m py_compile src/main.py src/application.py src/window.py

      - name: Test
        run: python3 -m pytest tests/ -q

      - name: Create tarball
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar czf "patchwork-$VERSION.tar.gz" \
            --transform "s,^,patchwork-$VERSION/," \
            --exclude=.git \
            --exclude=build \
            .

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: patchwork-*.tar.gz
          generate_release_notes: true
